name: CI

on:
  push:
    branches: [main]
  pull_request:

# publicリポジトリではforkからのPRでもCIが走る。既定の書き込み権限を渡さない。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # 通常は約70秒で終わる。止まったときに既定の6時間待たないよう打ち切る。
    timeout-minutes: 5
    steps:
      # Actionは移動しうるタグではなく完全長SHAで固定する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Publishと同じnpmで検査する。npmの版で`npm pack --json`の出力形式が変わるため。
      - name: npmを固定版へ更新
        run: npm install -g npm@12.0.2

      - name: 依存を導入
        run: bun install --frozen-lockfile

      # 検査の実体はpackage.jsonの`check`1箇所にある。CI側に検査を書き足さない。
      # Next.js導入例の検証も`check`の中で、このcommitからpackした配布物に対して行う。
      - name: 検査
        run: bun run check
